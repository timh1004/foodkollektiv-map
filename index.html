  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;
        flex-direction:column;overflow:hidden}
  header{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 2px;font-size:17px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
         border-bottom:1px solid var(--line)}
  .stat{background:var(--panel);padding:9px 8px;text-align:center}
  .stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
  .stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .ctrl{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
  input,select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:5px;
               background:var(--panel);color:var(--ink)}
  input[type=search]{flex:1;min-width:130px}
  .tabs{display:flex;gap:4px}
  .tab{padding:5px 11px;border:1px solid var(--line);border-radius:5px;cursor:pointer;
       background:var(--panel);font-size:12px}
  .tab[aria-selected=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
  .list{overflow-y:auto;flex:1}
  .row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:#faf9f6}
  .row.sel{background:#f1ede6;box-shadow:inset 3px 0 0 var(--accent)}
  .nm{font-weight:600}
  .row.closed .nm{color:var(--closed);text-decoration:line-through}
  .meta{color:var(--muted);font-size:12px;margin-top:1px}
  .pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;
        background:#efece5;color:var(--muted);margin-left:5px;vertical-align:1px}
  .pill.warn{background:#f6e2dc;color:#8c2f10}
  .ev{font-size:12px;color:var(--muted);font-style:italic;margin-top:3px;
      border-left:2px solid var(--line);padding-left:7px}
  .links a{color:var(--accent);text-decoration:none;font-size:12px;margin-right:10px}
  .links a:hover{text-decoration:underline}
  #map{height:100vh}
  .leaflet-container{background:#e8e6e0}
  .dot{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .legend{background:rgba(255,255,255,.94);padding:8px 10px;border-radius:6px;
          font-size:11px;line-height:1.7;box-shadow:0 1px 5px rgba(0,0,0,.2)}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
  @media (max-width:820px){.wrap{grid-template-columns:1fr;grid-template-rows:45vh 55vh}
    aside{border-right:0;border-bottom:1px solid var(--line)}#map{height:55vh}}
</style>

const S = DATA.stats, V = DATA.venues, T = DATA.timeline;
const col = t => getComputedStyle(document.documentElement).getPropertyValue('--t-'+(t||'other')).trim() || '#6b6a66';
const de = s => s ? new Date(s).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'}) : '';
const gmaps = p => 'https://www.google.com/maps/place/?q=place_id:' + p;

document.getElementById('sub').textContent =
  `${S.creator} · ${S.posts} Posts · ${S.period[0]} bis ${S.period[1]}`;
document.getElementById('statbar').innerHTML = [
  [S.venues,'Orte'], [S.mentions,'Nennungen'], [S.geocoded,'auf Karte'], [S.multi,'mehrfach']
].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

const map = L.map('map',{zoomControl:true}).setView([48.14,11.57],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
const legend = L.control({position:'bottomright'});
legend.onAdd = () => { const d = L.DomUtil.create('div','legend');
  d.innerHTML = Object.keys(S.by_type).map(t=>
    `<div><i style="background:${col(t)}"></i>${t} (${S.by_type[t]})</div>`).join('');
  return d; };
legend.addTo(map);

const layer = L.layerGroup().addTo(map);
const markers = {};
let mode='places', sel=null;

const fill = (el,vals,label) => {
  el.innerHTML = `<option value="">${label}</option>` +
    vals.map(v=>`<option>${v}</option>`).join(''); };
fill(document.getElementById('city'), Object.keys(S.by_city), 'alle Städte');
fill(document.getElementById('type'), Object.keys(S.by_type), 'alle Arten');

function visible(){
  const q = document.getElementById('q').value.toLowerCase();
  const c = document.getElementById('city').value;
  const t = document.getElementById('type').value;
  const onlyMulti = document.getElementById('multi').checked;
  const hideClosed = document.getElementById('open').checked;
  const src = mode==='places' ? V : T;
  return src.filter(r=>{
    const name = r.name || r.venue;
    if (hideClosed && r.status==='CLOSED_PERMANENTLY') return false;
    if (onlyMulti && mode==='places' && r.mentions<2) return false;
    if (c && r.city!==c) return false;
    if (t && r.type!==t) return false;
    if (q && !((name+' '+(r.city||'')+' '+(r.evidence||'')).toLowerCase().includes(q))) return false;
    return true;
  });
}

function draw(){
  const rows = visible();
  const list = document.getElementById('list');
  list.innerHTML = rows.map((r,i)=>{
    const name = r.name || r.venue, closed = r.status==='CLOSED_PERMANENTLY';
    const id = r.id || r.venue_id;
    const head = mode==='places'
      ? `${r.mentions}× · ${r.city||'—'} · ${r.type}${r.status==='CLOSED_TEMPORARILY'?'<span class="pill warn">vorübergehend zu</span>':''}${closed?'<span class="pill warn">dauerhaft zu</span>':''}`
      : `${de(r.date)} · ${r.city||'—'} · ${r.source}`;
    const ev = mode==='time' && r.evidence ? `<div class="ev">„${r.evidence}"</div>` : '';
    const links = [];
    if (r.pid) links.push(`<a href="${gmaps(r.pid)}" target="_blank" rel="noopener">Google Maps</a>`);
    if (r.permalink) links.push(`<a href="${r.permalink}" target="_blank" rel="noopener">Post</a>`);
    return `<div class="row${closed?' closed':''}" data-i="${i}" data-v="${id}">
      <div class="nm">${name}</div><div class="meta">${head}</div>${ev}
      <div class="links">${links.join('')}</div></div>`;
  }).join('') || '<div class="row meta">Nichts gefunden.</div>';

  layer.clearLayers();
  const seen = new Set(); const pts = [];
  rows.forEach(r=>{
    const id = r.id || r.venue_id;
    if (!r.lat || seen.has(id)) return;
    seen.add(id);
    const closed = r.status==='CLOSED_PERMANENTLY';
    const n = mode==='places' ? r.mentions : 1;
    const size = Math.min(9 + n*2.5, 22);
    const m = L.marker([r.lat,r.lng], {icon: L.divIcon({className:'',
      iconSize:[size,size], iconAnchor:[size/2,size/2],
      html:`<div class="dot" style="width:${size}px;height:${size}px;background:${closed?'var(--closed)':col(r.type)};opacity:${closed?.55:.92}"></div>`})});
    m.bindPopup(`<b>${r.name||r.venue}</b><br>${r.city||''} · ${r.type}` +
      (r.mentions?`<br>${r.mentions}× empfohlen`:'') +
      (closed?'<br><b>dauerhaft geschlossen</b>':'') +
      (r.pid?`<br><a href="${gmaps(r.pid)}" target="_blank">Google Maps</a>`:''));
    m.addTo(layer); markers[id]=m; pts.push([r.lat,r.lng]);
  });
  document.getElementById('ttl').textContent =
    mode==='places' ? `${rows.length} Orte` : `${rows.length} Nennungen`;
  if (pts.length && (document.getElementById('city').value || document.getElementById('q').value))
    map.fitBounds(pts, {padding:[40,40], maxZoom:15});
}

document.getElementById('list').addEventListener('click', e=>{
  const row = e.target.closest('.row'); if(!row || e.target.tagName==='A') return;
  document.querySelectorAll('.row.sel').forEach(r=>r.classList.remove('sel'));
  row.classList.add('sel');
  const m = markers[row.dataset.v];
  if (m){ map.setView(m.getLatLng(), Math.max(map.getZoom(),15)); m.openPopup(); }
});
['q','city','type','multi','open'].forEach(id=>
  document.getElementById(id).addEventListener('input', draw));
document.getElementById('tab-places').onclick = ()=>{mode='places';
  document.getElementById('tab-places').ariaSelected='true';
  document.getElementById('tab-time').ariaSelected='false'; draw();};
document.getElementById('tab-time').onclick = ()=>{mode='time';
  document.getElementById('tab-time').ariaSelected='true';
  document.getElementById('tab-places').ariaSelected='false'; draw();};
draw();
</script>
</body></html>
