<title>Empfehlungsatlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ground:#eaeef0; --panel:#f6f8f9; --sheet:#dfe6ea;
  --ink:#14212b; --muted:#5d7183; --line:#cfd8de; --line-soft:#dde4e8;
  --fk:#c2410c; --az:#0f766e; --c3:#1d4ed8; --c4:#db2777; --both:#6d28d9; --closed:#94a3b8; --alarm:#a3341a;
  --grat:#b9c6ce;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --disp:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d1620; --panel:#131f2a; --sheet:#0a121a;
    --ink:#dbe6ed; --muted:#8ba0b1; --line:#25333f; --line-soft:#1c2833;
    --fk:#f97b4a; --az:#4bbfb2; --c3:#7dabff; --c4:#fb8fc4; --both:#a98bf5; --closed:#5c6b78; --alarm:#f08a6a;
    --grat:#233240;
  }
}
:root[data-theme="dark"]{
  --ground:#0d1620; --panel:#131f2a; --sheet:#0a121a;
  --ink:#dbe6ed; --muted:#8ba0b1; --line:#25333f; --line-soft:#1c2833;
  --fk:#f97b4a; --az:#4bbfb2; --c3:#7dabff; --c4:#fb8fc4; --both:#a98bf5; --closed:#5c6b78; --alarm:#f08a6a;
  --grat:#233240;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     font-size:13.5px;line-height:1.5;height:100vh;overflow:hidden}
.shell{display:grid;grid-template-columns:390px 1fr;height:100vh}

/* ---------- Bedienleiste ---------- */
.rail{background:var(--panel);border-right:1px solid var(--line);
      display:flex;flex-direction:column;overflow:hidden}
.masthead{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
h1{font-family:var(--disp);font-weight:700;font-size:25px;line-height:1.05;margin:0;
   letter-spacing:-.015em;text-wrap:balance}
.standfirst{color:var(--muted);font-size:12px;margin-top:5px;font-family:var(--mono)}

.figures{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.fig{padding:10px 6px 11px;text-align:center;border-right:1px solid var(--line-soft)}
.fig:last-child{border-right:0}
.fig b{display:block;font-family:var(--mono);font-weight:500;font-size:19px;
       font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fig span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

.band{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;
      gap:7px;flex-wrap:wrap;align-items:center}
.band + .band{border-top:0}
label.chk{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}

.seg{display:flex;width:100%;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;appearance:none;border:0;background:var(--panel);color:var(--muted);
            font-family:var(--sans);font-size:11.5px;font-weight:500;padding:7px 4px;cursor:pointer;
            border-right:1px solid var(--line-soft);display:flex;align-items:center;
            justify-content:center;gap:5px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:focus-visible{outline:2px solid var(--both);outline-offset:-2px}
.swatch{width:7px;height:7px;border-radius:50%;flex:none}

input[type=search],select{font-family:var(--sans);font-size:12px;padding:6px 8px;
  border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink)}
input[type=search]{flex:1;min-width:120px}
input[type=search]:focus-visible,select:focus-visible{outline:2px solid var(--both);outline-offset:1px}

.tabs{display:flex;gap:14px;padding:9px 18px 0;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;background:none;border:0;padding:0 0 8px;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.roll{overflow-y:auto;flex:1}
.entry{padding:11px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer;
       display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.entry:hover{background:var(--ground)}
.entry[aria-current="true"]{background:var(--ground);box-shadow:inset 3px 0 0 var(--pin,var(--ink))}
.entry .name{font-weight:600;font-size:13px;grid-column:1}
.entry .count{font-family:var(--mono);font-size:11px;color:var(--muted);grid-column:2;
              text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.entry .sub{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.entry.shut .name{color:var(--closed);text-decoration:line-through}
.quote{grid-column:1/-1;font-size:11.5px;color:var(--muted);border-left:2px solid var(--line);
       padding-left:8px;margin-top:3px}
.tag{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:3px;
     border:1px solid currentColor;margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.tag.shut{color:var(--alarm)}
.vid{opacity:.72;font-style:italic}
.jump{grid-column:1/-1;margin-top:5px;display:flex;gap:12px}
.jump a{font-size:11.5px;color:var(--pin,var(--ink));text-decoration:none;
        border-bottom:1px solid transparent}
.jump a:hover,.jump a:focus-visible{border-bottom-color:currentColor}
.empty{padding:26px 18px;color:var(--muted);font-size:12.5px}

/* ---------- Chartfläche ---------- */
.chart{position:relative;min-width:0;min-height:0;background:var(--sheet)}
#map{position:absolute;inset:0;background:var(--sheet)}
.leaflet-container{background:#e8e6e0;font-family:var(--sans)}
.pin{border-radius:50%;box-shadow:0 0 0 1.5px var(--sheet)}
.pin.shut{background:none!important;border:1.5px dashed var(--closed)}
.pin.duo{box-shadow:0 0 0 2px var(--both),0 0 0 3.5px var(--sheet)}
.placename{font-family:var(--mono);font-size:10px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.11em;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 3px var(--sheet),0 0 3px var(--sheet)}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:7px;
  box-shadow:0 4px 18px rgba(0,0,0,.22)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:11px 13px;font-size:12.5px;line-height:1.5}
.leaflet-popup-content b{font-size:13.5px}
.leaflet-popup-content a{color:var(--ink)}
.leaflet-popup-content .k{font-family:var(--mono);font-size:11px;color:var(--muted)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--ground)}
.key{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font-size:11px;z-index:500;max-width:210px}
.key h2{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--muted);margin:0 0 6px;font-weight:500}
.key div{display:flex;align-items:center;gap:6px;margin-top:3px}
.scalebar{position:absolute;left:12px;bottom:12px;z-index:500;font-family:var(--mono);
  font-size:10px;color:var(--muted)}
.scalebar i{display:block;width:100px;height:5px;border:1px solid var(--grat);border-top:0}
.hint{position:absolute;left:56px;top:12px;z-index:500;font-family:var(--mono);font-size:10px;
  color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:5px 8px;max-width:230px;line-height:1.45}

@media (max-width:880px){
  .shell{grid-template-columns:1fr;grid-template-rows:52vh 48vh}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside class="rail">
    <div class="masthead">
      <h1>Empfehlungsatlas</h1>
      <div class="standfirst" id="standfirst"></div>
    </div>
    <div class="figures" id="figures"></div>

    <div class="band">
      <div class="seg" id="whose" role="group" aria-label="Creator"></div>
    </div>
    <div class="band">
      <input type="search" id="q" placeholder="Ort, Stadt, Zitat …" aria-label="Suche">
      <select id="city" aria-label="Stadt"></select>
      <select id="type" aria-label="Art"></select>
    </div>
    <div class="band">
      <label class="chk"><input type="checkbox" id="repeat"> nur mehrfach empfohlen</label>
      <label class="chk"><input type="checkbox" id="hide" checked> geschlossene aus</label>
    </div>

    <div class="tabs" role="tablist">
      <button id="t-orte" role="tab" aria-selected="true">Orte</button>
      <button id="t-zeit" role="tab" aria-selected="false">Chronik</button>
    </div>
    <div class="roll" id="roll"></div>
  </aside>

  <div class="chart">
    <div id="map"></div>
    <div class="hint">Punktgröße = Anzahl Empfehlungen. Klick auf eine Zeile springt zum Ort.</div>
    <div class="scalebar" id="scalebar"><span id="scaletext"></span><i></i></div>
    <div class="key" id="key"></div>
  </div>
</div>

gna",10],["Batumi",10],["Wien",8],["Gaziantep",8],["Heidelberg",8],["Stuttgart",6]],"types":[["restaurant",411],["other",135],["shop",70],["bar",56],["cafe",50],["hotel",35],["festival",30],["market",14],["kiosk",8],["streetfood",5]]}};
const V = D.venues, T = D.timeline, CR = D.creators, PER = D.per, TOT = D.totals;
const SLUGS = Object.keys(CR);
const PALETTE = ['var(--fk)','var(--az)','var(--c3)','var(--c4)'];
// Kanaele behalten ihre Farbe in der Reihenfolge, in der sie dazukamen -
// sonst wandert bei jedem neuen Kanal die halbe Karte um
const PINNED = {foodkollektiv:'var(--fk)', andyzingler:'var(--az)',
                'randy-gamble':'var(--c3)', 'bruno-pecorino':'var(--c4)'};
// die beiden ersten Kanaele behalten ihre Farbe, neue bekommen die naechste freie
const HUE = {}; let free = PALETTE.filter(c => !Object.values(PINNED).includes(c));
SLUGS.forEach(s => HUE[s] = PINNED[s] || free.shift() || 'var(--ink)');
const MANY = SLUGS.length > 2 ? 'mehreren' : 'beiden';
const byId = new Map(V.map(v => [v.i, v]));
const de = s => s ? s.split('-').reverse().join('.') : '';
const tc = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const mapsUrl = p => 'https://www.google.com/maps/place/?q=place_id:' + p;
const TYPE_DE = {restaurant:'Restaurant',cafe:'Café',bar:'Bar',kiosk:'Kiosk',hotel:'Hotel',
  shop:'Laden',market:'Markt',festival:'Festival',other:'sonstiges'};

let whose = 'all', view = 'orte', picked = null;

/* ---------- Kopf ---------- */
const span = [
  Object.values(PER).map(p=>p.from).filter(Boolean).sort()[0],
  Object.values(PER).map(p=>p.to).filter(Boolean).sort().slice(-1)[0]];
document.getElementById('standfirst').textContent =
  `${SLUGS.length} Kanäle · ${de(span[0])} – ${de(span[1])}`;

document.getElementById('whose').innerHTML = [
  `<button data-w="all" aria-pressed="true">alle</button>`,
  ...SLUGS.map(s => `<button data-w="${s}" aria-pressed="false">
      <i class="swatch" style="background:${HUE[s]}"></i>${CR[s].name.split('|')[0].trim()}</button>`),
  `<button data-w="both" aria-pressed="false">
      <i class="swatch" style="background:var(--both)"></i>${SLUGS.length>2?'mehrere':'beide'}</button>`,
].join('');

document.getElementById('key').innerHTML = '<h2>Legende</h2>' + [
  ...SLUGS.map(s => `<div><i class="swatch" style="background:${HUE[s]}"></i>${CR[s].name.split('|')[0].trim()}</div>`),
  `<div><i class="swatch" style="background:var(--both);"></i>von ${MANY} Kanälen empfohlen</div>`,
  `<div><i class="swatch" style="border:1.5px dashed var(--closed);background:none"></i>dauerhaft geschlossen</div>`,
].join('');

const fill = (el, vals, all) => el.innerHTML =
  `<option value="">${all}</option>` + vals.map(v => `<option>${v}</option>`).join('');
fill(document.getElementById('city'), TOT.cities.map(c => c[0]), 'alle Städte');
fill(document.getElementById('type'), TOT.types.map(t => t[0]), 'alle Arten');
document.getElementById('type').querySelectorAll('option').forEach(o => {
  if (o.value) o.textContent = TYPE_DE[o.value] || o.value; });

/* ---------- Karte: Gradnetz statt Tiles ---------- */
const map = L.map('map', {zoomControl:true, worldCopyJump:false,
  minZoom:2, maxZoom:17, attributionControl:true}).setView([48.14,11.57], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

// Städte-Anker aus den Daten selbst: Mittelpunkt aller Orte je Stadt
const anchors = {};
V.forEach(v => { if (!v.la || !v.c) return;
  (anchors[v.c] = anchors[v.c] || []).push([v.la, v.lo]); });
const cityLayer = L.layerGroup();
Object.entries(anchors).filter(([,pts]) => pts.length >= 2).forEach(([name, pts]) => {
  const la = pts.reduce((s,p)=>s+p[0],0)/pts.length, lo = pts.reduce((s,p)=>s+p[1],0)/pts.length;
  L.marker([la, lo], {interactive:false, keyboard:false, icon: L.divIcon({
    className:'', iconSize:[160,14], iconAnchor:[80,7],
    html:`<div class="placename" style="text-align:center">${name}</div>`})}).addTo(cityLayer);
});

const pins = L.layerGroup().addTo(map);
const markers = new Map();

function scalebar(){
  const y = map.getSize().y/2;
  const a = map.containerPointToLatLng([0,y]), b = map.containerPointToLatLng([100,y]);
  const m = a.distanceTo(b);
  const txt = m > 1500 ? Math.round(m/1000) + ' km' : Math.round(m) + ' m';
  document.getElementById('scaletext').textContent = txt + ' ≈ 100 px';
}
map.on('zoomend moveend', scalebar);

/* ---------- Filter ---------- */
function crMatch(v){
  if (whose === 'all') return true;
  if (whose === 'both') return v.cr.length > 1;
  return v.cr.includes(whose);
}
function rows(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const city = document.getElementById('city').value;
  const type = document.getElementById('type').value;
  const rep = document.getElementById('repeat').checked;
  const hide = document.getElementById('hide').checked;
  const okVenue = v => crMatch(v) && !(hide && v.s === 2) && !(rep && v.m < 2)
    && (!city || v.c === city) && (!type || v.t === type);

  if (view === 'orte')
    return V.filter(v => okVenue(v) &&
      (!q || (v.n + ' ' + v.c + ' ' + v.ad).toLowerCase().includes(q)))
      .sort((a,b) => b.m - a.m || (a.n > b.n ? 1 : -1));

  return T.filter(t => {
    const v = byId.get(t.v); if (!v || !okVenue(v)) return false;
    if (whose !== 'all' && whose !== 'both' && t.cr !== whose) return false;
    return !q || (v.n + ' ' + v.c + ' ' + t.e).toLowerCase().includes(q);
  });
}

function figures(){
  const list = V.filter(crMatch);
  const mentions = whose === 'all' ? TOT.mentions
    : whose === 'both' ? T.filter(t => (byId.get(t.v)||{cr:[]}).cr.length > 1).length
    : PER[whose].mentions;
  const posts = whose === 'all'
    ? SLUGS.reduce((s,k) => s + PER[k].posts, 0)
    : whose === 'both' ? '–' : PER[whose].posts;
  document.getElementById('figures').innerHTML = [
    [list.length, 'Orte'], [mentions, 'Nennungen'],
    [list.filter(v => v.m > 1).length, 'mehrfach'], [posts, 'Posts'],
  ].map(([n,l]) => `<div class="fig"><b>${n}</b><span>${l}</span></div>`).join('');
}

function paint(){
  const data = rows();
  const roll = document.getElementById('roll');

  roll.innerHTML = data.length ? data.map(r => {
    const v = view === 'orte' ? r : byId.get(r.v);
    const hue = v.cr.length > 1 ? 'var(--both)' : HUE[v.cr[0]] || 'var(--ink)';
    const shut = v.s === 2;
    const tags = (shut ? '<span class="tag shut">dauerhaft zu</span>'
                : v.s === 1 ? '<span class="tag shut">vorübergehend zu</span>' : '')
      + (v.ev ? '<span class="tag">Termin</span>' : '');
    const links = [
      v.p ? `<a href="${mapsUrl(v.p)}" target="_blank" rel="noopener">Google Maps</a>` : '',
      view === 'zeit' ? `<a href="${r.u}" target="_blank" rel="noopener">${
        r.pl === 'youtube' ? (r.tc ? 'Video ab ' + tc(r.tc) : 'Video') : 'Post'}</a>` : '',
    ].filter(Boolean).join('');
    const sub = view === 'orte'
      ? `${TYPE_DE[v.t] || v.t}${v.c ? ' · ' + v.c : ''} · zuletzt ${de(v.l)}`
      : `${de(r.d)} · ${CR[r.cr].name.split('|')[0].trim()}${v.c ? ' · ' + v.c : ''}${
          r.ti ? ' · <span class="vid">' + r.ti + '</span>' : ''}`;
    const SRC = {ocr:'aus Video', both:'Text + Video', location_tag:'Ortstag',
                 transcript:'gesprochen', caption:'Caption', usertag:'Markierung'};
    const right = view === 'orte' ? `${v.m}×` : (SRC[r.s] || r.s || 'Caption');
    return `<div class="entry${shut ? ' shut' : ''}" data-v="${v.i}"
              style="--pin:${hue}" tabindex="0" role="button">
      <div class="name">${v.n}${tags}</div>
      <div class="count">${right}</div>
      <div class="sub">${sub}</div>
      ${view === 'zeit' && r.e ? `<div class="quote">„${r.e}"</div>` : ''}
      <div class="jump">${links}</div></div>`;
  }).join('') : '<div class="empty">Kein Treffer. Filter weiter fassen?</div>';

  // Pins
  pins.clearLayers(); markers.clear();
  const seen = new Set(); const pts = [];
  data.forEach(r => {
    const v = view === 'orte' ? r : byId.get(r.v);
    if (!v.la || seen.has(v.i)) return;
    seen.add(v.i);
    const duo = v.cr.length > 1, shut = v.s === 2;
    const hue = duo ? 'var(--both)' : HUE[v.cr[0]] || 'var(--ink)';
    const d = Math.min(9 + Math.sqrt(v.m) * 4, 26);
    const m = L.marker([v.la, v.lo], {title: v.n, icon: L.divIcon({className:'',
      iconSize:[d,d], iconAnchor:[d/2,d/2],
      html:`<div class="pin${shut?' shut':''}${duo?' duo':''}"
              style="width:${d}px;height:${d}px;background:${hue};opacity:${shut?1:.9}"></div>`})});
    m.bindPopup(`<b>${v.n}</b><br><span class="k">${TYPE_DE[v.t]||v.t}${v.c?' · '+v.c:''}</span>`
      + (v.ad ? `<br>${v.ad}` : '')
      + `<br><span class="k">${v.m}× empfohlen · ${v.cr.map(s=>CR[s].name.split('|')[0].trim()).join(' + ')}</span>`
      + (shut ? '<br><b>dauerhaft geschlossen</b>' : '')
      + (v.p ? `<br><a href="${mapsUrl(v.p)}" target="_blank" rel="noopener">Google Maps</a>` : ''));
    m.addTo(pins); markers.set(v.i, m); pts.push([v.la, v.lo]);
  });
  figures();
  return pts;
}

function refit(){
  const pts = paint();
  if (pts.length > 1) map.fitBounds(pts, {padding:[50,50], maxZoom:14});
  else if (pts.length === 1) map.setView(pts[0], 14);
  scalebar();
}

/* ---------- Bedienung ---------- */
document.getElementById('whose').addEventListener('click', e => {
  const b = e.target.closest('button[data-w]'); if (!b) return;
  whose = b.dataset.w;
  document.querySelectorAll('#whose button').forEach(x =>
    x.setAttribute('aria-pressed', String(x === b)));
  refit();
});
['q','city','type','repeat','hide'].forEach(id =>
  document.getElementById(id).addEventListener('input', () => {
    const id2 = document.activeElement && document.activeElement.id;
    id2 === 'q' ? paint() : refit();
  }));
const tab = (which) => {
  view = which;
  document.getElementById('t-orte').setAttribute('aria-selected', String(which === 'orte'));
  document.getElementById('t-zeit').setAttribute('aria-selected', String(which === 'zeit'));
  paint();
  document.getElementById('roll').scrollTop = 0;
};
document.getElementById('t-orte').onclick = () => tab('orte');
document.getElementById('t-zeit').onclick = () => tab('zeit');

function select(el){
  if (!el) return;
  document.querySelectorAll('.entry[aria-current]').forEach(x => x.removeAttribute('aria-current'));
  el.setAttribute('aria-current','true');
  const m = markers.get(Number(el.dataset.v));
  if (m){ map.setView(m.getLatLng(), Math.max(map.getZoom(), 15)); m.openPopup(); }
}
document.getElementById('roll').addEventListener('click', e => {
  if (e.target.tagName === 'A') return;
  select(e.target.closest('.entry'));
});
document.getElementById('roll').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){
    const el = e.target.closest('.entry');
    if (el){ e.preventDefault(); select(el); }
  }
});

/* Leaflet liest die Containergroesse beim Init. Als absolut positioniertes
   Grid-Kind steht die zu dem Zeitpunkt noch nicht fest - ohne invalidateSize
   rechnet fitBounds auf einer Flaeche von fast null und es erscheint nichts. */
function boot(){
  map.invalidateSize(true);
  refit();
}
if (document.readyState === 'complete') requestAnimationFrame(boot);
else window.addEventListener('load', () => requestAnimationFrame(boot));
window.addEventListener('resize', () => map.invalidateSize());
</script>
